name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate manifest
        run: node scripts/validate-plugin.mjs

      - name: Check QML structure
        run: node scripts/check-qml.mjs

      - name: Test ledge model
        run: node scripts/test-model.mjs

      - name: Check CLI
        run: |
          bash -n bin/omarchy-ledge
          shellcheck bin/omarchy-ledge
